# Local Wi-Fi testing stack.
#
# This file is for physical-device LAN testing. It defaults to localhost so
# browser-based admin testing does not accidentally bake in an old Wi-Fi IP.
#
# For physical-device LAN testing, set your current Windows Wi-Fi IPv4 address first:
#   $env:WINDOWS_HOST_IP="YOUR_WIFI_IPV4"
#   docker compose -f docker-compose.lan.yml up -d --build

services:
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres

  redis:
    extends:
      file: docker-compose.yml
      service: redis

  neo4j:
    extends:
      file: docker-compose.yml
      service: neo4j

  backend:
    build:
      context: ./apps/backend
      target: development
    env_file:
      - apps/backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      WINDOWS_HOST_IP: "${WINDOWS_HOST_IP:-localhost}"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,${WINDOWS_HOST_IP:-localhost}"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://${WINDOWS_HOST_IP:-localhost}:5173,http://${WINDOWS_HOST_IP:-localhost}:3000"
      CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://${WINDOWS_HOST_IP:-localhost}:5173,http://${WINDOWS_HOST_IP:-localhost}:3000"
    command: sh -c "pip install -r requirements/dev.txt && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./apps/backend:/app
    ports:
      - "0.0.0.0:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  celery_worker:
    build:
      context: ./apps/backend
      target: development
    env_file:
      - apps/backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      WINDOWS_HOST_IP: "${WINDOWS_HOST_IP:-localhost}"
    command: sh -c "pip install -r requirements/dev.txt && celery -A config worker -l info"
    volumes:
      - ./apps/backend:/app
    depends_on:
      - backend
      - redis

  celery_beat:
    build:
      context: ./apps/backend
      target: development
    env_file:
      - apps/backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      WINDOWS_HOST_IP: "${WINDOWS_HOST_IP:-localhost}"
    command: sh -c "pip install -r requirements/dev.txt && celery -A config beat -l info"
    volumes:
      - ./apps/backend:/app
    depends_on:
      - backend
      - redis

  admin_panel:
    build:
      context: ./apps/admin-panel
      target: development
    env_file:
      - apps/admin-panel/.env
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8000/api/v1}"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./apps/admin-panel:/app
      - admin_node_modules:/app/node_modules
    ports:
      - "0.0.0.0:${ADMIN_PANEL_PORT:-5173}:5173"
    depends_on:
      - backend

  landing_page:
    image: node:20-alpine
    working_dir: /app
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    volumes:
      - ./apps/landing-page:/app
      - landing_node_modules:/app/node_modules
    ports:
      - "0.0.0.0:${LANDING_PAGE_PORT:-3000}:3000"
    depends_on:
      - backend

  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "0.0.0.0:${DOZZLE_PORT:-9999}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  admin_node_modules:
  landing_node_modules:
