<script>
        // Micro-interactions for form inputs
        const inputs = document.querySelectorAll('input, select, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
                input.parentElement.style.transition = 'transform 0.2s ease-out';
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Simple segmented control logic
        const labels = document.querySelectorAll('.segmented-control label');
        labels.forEach(label => {
            label.addEventListener('click', () => {
                // Visual feedback only, radio handles state
                console.log('Meal type selected:', label.innerText);
            });
        });
