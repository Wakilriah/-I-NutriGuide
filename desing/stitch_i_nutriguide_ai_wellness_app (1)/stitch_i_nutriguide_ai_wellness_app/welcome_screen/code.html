<body class="bg-background text-on-background font-body-md overflow-hidden">
<!-- Immersive Welcome Screen -->
<main class="relative h-screen w-full flex flex-col justify-end bg-welcome-hero" data-alt="A top-down premium food photography shot of a vibrant Buddha bowl filled with fresh kale, sliced avocados, roasted chickpeas, purple cabbage, and a sprinkling of pumpkin seeds. The lighting is bright and natural, creating a soft, life-affirming atmosphere. The color palette is rich in organic greens and earthy tones, perfectly embodying a modern minimalist wellness aesthetic with a sense of calm and vitality.">
<!-- Gradient Overlays for Readability -->
<div class="absolute inset-0 bg-gradient-to-t from-primary/90 via-primary/40 to-transparent"></div>
<div class="absolute inset-0 bg-gradient-to-b from-black/20 via-transparent to-transparent"></div>
<!-- Content Container -->
<div class="relative z-10 w-full max-w-[1200px] mx-auto px-container-padding pb-16 flex flex-col items-center text-center">
<!-- Logo Section -->
<div class="mb-stack-gap animate-fade-in-down">
<img alt="I-NutriGuide Logo" class="w-24 h-24 rounded-full shadow-lg border-4 border-white/20" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCnq35Sz7Y1-UIz66n6KimTB33g_G95wOIeFcQwnCa7fajs9_FG7pM2dH8xqqf803NTIorku_-qh3puWy1i8LKu7xUgLK9383InJmOVKwB8ry0NvM3t8F0OKD-12rmlFBvj8G-VMZ9i-gNIxy30-cCYtpCVTfiAeC1OkFuN65yVEk7JJZgOxX8xTr8wTWuBWnevf3k3kvDTDFTL4udB6G78_hSQ8c5pHdVPtUHW7iWYJY89c_2KGNBtoNVNXMQ0GjF8J8pcd0gm6jc"/>
</div>
<!-- Typography Section -->
<div class="mb-section-gap space-y-2">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-display-lg md:text-display-lg text-white drop-shadow-md">
                    I-NutriGuide
                </h1>
<p class="font-body-lg text-body-lg text-white/90 max-w-xs mx-auto leading-tight">
                    Smart food recommendations for your supplements
                </p>
</div>
<!-- Action Section -->
<div class="w-full max-w-sm space-y-4">
<!-- Primary Action -->
<button class="w-full h-14 bg-secondary-container hover:bg-secondary text-on-secondary-container hover:text-on-secondary font-label-md text-label-md rounded-full shadow-xl transition-all duration-300 active:scale-95 flex items-center justify-center gap-2 group" onclick="handleStart()">
                    Get Started
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<!-- Secondary Action -->
<button class="w-full h-14 soft-glass border border-white/30 text-white font-label-md text-label-md rounded-full transition-all duration-300 hover:bg-white/20 active:scale-95" onclick="handleLogin()">
                    Already have an account? Log in
                </button>
</div>
<!-- Trust / Micro-copy -->
<div class="mt-8">
<p class="text-white/60 font-label-md text-[12px] uppercase tracking-widest">
                    Your Personal Wellness Partner
                </p>
</div>
</div>
<!-- Atmospheric Floating Elements (Decorative) -->
<div class="absolute top-20 left-10 w-32 h-32 bg-primary-fixed-dim/20 rounded-full blur-3xl animate-pulse"></div>
<div class="absolute bottom-40 right-0 w-48 h-48 bg-secondary-fixed-dim/10 rounded-full blur-3xl"></div>
</main>
<!-- Navigation suppression: Not included as this is a transactional/onboarding splash screen -->
<script>
        // Simple Interaction Logic
        function handleStart() {
            const btn = event.currentTarget;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            setTimeout(() => {
                console.log("Navigating to onboarding...");
                // In a real app: window.location.href = '/onboarding';
            }, 800);
        }

        function handleLogin() {
            console.log("Opening login modal...");
        }

        // Entrance Animation
        document.addEventListener('DOMContentLoaded', () => {
            const elements = document.querySelectorAll('.animate-fade-in-down');
            elements.forEach((el, i) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(-20px)';
                el.style.transition = 'all 0.8s ease-out';
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 100 * i);
            });
        });
    </script>
<style>
        @keyframes fade-in-down {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-down {
            animation: fade-in-down 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
